<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-primary); font-family: var(--font-serif); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 60px; }
  .swatch-block { height: 64px; border: 1px solid var(--border-default); }
  .swatch-label { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); margin-top: 6px; }
  .swatch-hex { font-size: 11px; color: var(--fg-secondary); font-family: var(--font-mono); }
  .section-title { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 12px; }
</style>
</head><body>
<div class="section-title">Neutrals</div>
<div class="row">
  <div class="swatch"><div class="swatch-block" style="background:#0A0A0A;"></div><div class="swatch-label">Black</div><div class="swatch-hex">#0A0A0A</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#1A1A1A;"></div><div class="swatch-label">Gray 900</div><div class="swatch-hex">#1A1A1A</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#3A3A3A;"></div><div class="swatch-label">Gray 700</div><div class="swatch-hex">#3A3A3A</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#727272;"></div><div class="swatch-label">Gray 500</div><div class="swatch-hex">#727272</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#9A9A9A;"></div><div class="swatch-label">Gray 400</div><div class="swatch-hex">#9A9A9A</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#CDCDCD;"></div><div class="swatch-label">Gray 300</div><div class="swatch-hex">#CDCDCD</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#E4E4E4;"></div><div class="swatch-label">Gray 200</div><div class="swatch-hex">#E4E4E4</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#F5F5F5;"></div><div class="swatch-label">Gray 100</div><div class="swatch-hex">#F5F5F5</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#F7F2E8; border-color:#E4E4E4;"></div><div class="swatch-label">Cream</div><div class="swatch-hex">#F7F2E8</div></div>
  <div class="swatch"><div class="swatch-block" style="background:#FFFFFF; border-color:#E4E4E4;"></div><div class="swatch-label">White</div><div class="swatch-hex">#FFFFFF</div></div>
</div>
</body></html>
