<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--color-gray-100); font-family: var(--font-serif); }
  .row { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 100px; height: 60px; background: var(--color-white); }
  .label { font-size: 10px; font-family: var(--font-mono); color: var(--fg-muted); text-align: center; }
  .sub { font-size: 10px; color: var(--fg-subtle); text-align: center; }
</style>
</head><body>
  <div class="row">
    <div class="item">
      <div class="box" style="box-shadow:none; border: 1px solid var(--border-default);"></div>
      <div class="label">--shadow-0</div>
      <div class="sub">Flat</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow:0 1px 3px rgba(10,10,10,0.08);"></div>
      <div class="label">--shadow-1</div>
      <div class="sub">Cards, inputs</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow:0 4px 16px rgba(10,10,10,0.10);"></div>
      <div class="label">--shadow-2</div>
      <div class="sub">Dropdowns</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow:0 12px 40px rgba(10,10,10,0.14);"></div>
      <div class="label">--shadow-3</div>
      <div class="sub">Modals</div>
    </div>
  </div>
</body></html>
