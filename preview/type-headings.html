<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-primary); font-family: var(--font-serif); }
  .row { display: flex; align-items: baseline; gap: 20px; padding: 8px 0; border-bottom: 1px solid var(--border-default); }
  .row:last-child { border-bottom: none; }
  .tag { font-size: 10px; font-family: var(--font-mono); color: var(--fg-subtle); min-width: 80px; }
  .size-tag { font-size: 10px; font-family: var(--font-mono); color: var(--fg-muted); min-width: 50px; }
</style>
</head><body>
  <div class="row"><div class="tag">h1</div><div class="size-tag">64px</div><div style="font-size:64px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;">Heading One</div></div>
  <div class="row"><div class="tag">h2</div><div class="size-tag">48px</div><div style="font-size:48px;font-weight:700;letter-spacing:-0.02em;line-height:1.15;">Heading Two</div></div>
  <div class="row"><div class="tag">h3</div><div class="size-tag">36px</div><div style="font-size:36px;font-weight:700;line-height:1.25;">Heading Three</div></div>
  <div class="row"><div class="tag">h4</div><div class="size-tag">28px</div><div style="font-size:28px;font-weight:700;line-height:1.35;">Heading Four</div></div>
  <div class="row"><div class="tag">h5</div><div class="size-tag">22px</div><div style="font-size:22px;font-weight:700;line-height:1.4;">Heading Five</div></div>
  <div class="row"><div class="tag">h6</div><div class="size-tag">18px</div><div style="font-size:18px;font-weight:700;line-height:1.5;">Heading Six</div></div>
</body></html>
