<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-primary); font-family: var(--font-serif); }
  .row { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); }
  .note { font-size: 10px; color: var(--fg-subtle); }
</style>
</head><body>
  <div class="row">
    <div class="item">
      <img src="../assets/shiba_inu.png" style="width:40px; image-rendering:pixelated;" alt="mascot 40px">
      <div class="label">Avatar</div>
      <div class="note">40px</div>
    </div>
    <div class="item">
      <img src="../assets/shiba_inu.png" style="width:72px; image-rendering:pixelated;" alt="mascot 72px">
      <div class="label">Icon</div>
      <div class="note">72px</div>
    </div>
    <div class="item">
      <img src="../assets/shiba_inu.png" style="width:110px; image-rendering:pixelated;" alt="mascot 110px">
      <div class="label">Card</div>
      <div class="note">110px</div>
    </div>
    <div class="item">
      <img src="../assets/shiba_inu.png" style="width:160px; image-rendering:pixelated;" alt="mascot 160px">
      <div class="label">Feature</div>
      <div class="note">160px</div>
    </div>
    <div class="item">
      <img src="../assets/shiba_inu.png" style="width:220px; image-rendering:pixelated;" alt="mascot 220px">
      <div class="label">Hero</div>
      <div class="note">220px</div>
    </div>
  </div>
</body></html>
