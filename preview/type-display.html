<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-primary); font-family: var(--font-serif); }
  .specimen { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border-default); }
  .specimen:last-child { border-bottom: none; margin-bottom: 0; }
  .meta { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 6px; font-family: var(--font-mono); }
</style>
</head><body>
  <div class="specimen">
    <div class="meta">Display — Logotype / 64px · Bold · Tracked 0.35em · Uppercase</div>
    <div style="font-size:56px; font-weight:700; letter-spacing:0.35em; text-transform:uppercase; line-height:1.1; font-family:var(--font-serif);">B.E.A.C.O.N.</div>
  </div>
  <div class="specimen">
    <div class="meta">Display — Hero / 48px · Bold · Tracked –0.02em</div>
    <div style="font-size:48px; font-weight:700; letter-spacing:-0.02em; line-height:1.15; font-family:var(--font-serif);">Your career<br>starts here.</div>
  </div>
  <div class="specimen">
    <div class="meta">Display — Subhero / 36px · Bold</div>
    <div style="font-size:36px; font-weight:700; letter-spacing:-0.01em; line-height:1.25; font-family:var(--font-serif);">Meet the people who<br>shape your industry.</div>
  </div>
</body></html>
