<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-primary); font-family: var(--font-serif); }
  .section-title { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 12px; }

  /* Icon list using Lucide CDN */
  .icon-grid { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .icon-item { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 56px; }
  .icon-label { font-size: 10px; color: var(--fg-muted); text-align: center; line-height: 1.3; }

  .icon-sizes { display: flex; gap: 20px; align-items: center; margin-top: 16px; }
  .size-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .size-label { font-size: 10px; color: var(--fg-muted); }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head><body>
  <div class="section-title">Lucide Icons — Recommended System (1.5px stroke, 24px default)</div>
  <div class="icon-grid">
    <div class="icon-item"><i data-lucide="users" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">users</div></div>
    <div class="icon-item"><i data-lucide="briefcase" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">briefcase</div></div>
    <div class="icon-item"><i data-lucide="calendar" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">calendar</div></div>
    <div class="icon-item"><i data-lucide="mic" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">mic</div></div>
    <div class="icon-item"><i data-lucide="award" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">award</div></div>
    <div class="icon-item"><i data-lucide="arrow-right" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">arrow-right</div></div>
    <div class="icon-item"><i data-lucide="mail" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">mail</div></div>
    <div class="icon-item"><i data-lucide="linkedin" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">linkedin</div></div>
    <div class="icon-item"><i data-lucide="instagram" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">instagram</div></div>
    <div class="icon-item"><i data-lucide="map-pin" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">map-pin</div></div>
    <div class="icon-item"><i data-lucide="clock" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">clock</div></div>
    <div class="icon-item"><i data-lucide="chevron-right" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="icon-label">chevron-right</div></div>
  </div>

  <div class="section-title" style="margin-top:20px;">Sizes — 16 · 20 · 24 · 32px</div>
  <div class="icon-sizes">
    <div class="size-item"><i data-lucide="briefcase" style="width:16px;height:16px;stroke-width:1.5;"></i><div class="size-label">16px</div></div>
    <div class="size-item"><i data-lucide="briefcase" style="width:20px;height:20px;stroke-width:1.5;"></i><div class="size-label">20px</div></div>
    <div class="size-item"><i data-lucide="briefcase" style="width:24px;height:24px;stroke-width:1.5;"></i><div class="size-label">24px</div></div>
    <div class="size-item"><i data-lucide="briefcase" style="width:32px;height:32px;stroke-width:1.5;"></i><div class="size-label">32px</div></div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
