<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-primary); font-family: var(--font-serif); }
  .row { display: flex; align-items: center; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border-default); }
  .row:last-child { border-bottom: none; }
  .size { font-size: 10px; font-family: var(--font-mono); color: var(--fg-subtle); min-width: 40px; }
  .name { font-size: 10px; font-family: var(--font-mono); color: var(--fg-muted); min-width: 90px; }
</style>
</head><body>
  <div class="row"><div class="size">80px</div><div class="name">--text-5xl</div><div style="font-size:80px;font-weight:700;line-height:1;">Aa</div></div>
  <div class="row"><div class="size">64px</div><div class="name">--text-4xl</div><div style="font-size:64px;font-weight:700;line-height:1;">Aa</div></div>
  <div class="row"><div class="size">48px</div><div class="name">--text-3xl</div><div style="font-size:48px;font-weight:700;line-height:1;">Aa</div></div>
  <div class="row"><div class="size">36px</div><div class="name">--text-2xl</div><div style="font-size:36px;font-weight:700;line-height:1;">Aa</div></div>
  <div class="row"><div class="size">28px</div><div class="name">--text-xl</div><div style="font-size:28px;font-weight:700;line-height:1;">Aa</div></div>
  <div class="row"><div class="size">22px</div><div class="name">--text-lg</div><div style="font-size:22px;line-height:1;">Aa</div></div>
  <div class="row"><div class="size">18px</div><div class="name">--text-md</div><div style="font-size:18px;line-height:1;">Aa</div></div>
  <div class="row"><div class="size">16px</div><div class="name">--text-base</div><div style="font-size:16px;line-height:1;">Aa</div></div>
  <div class="row"><div class="size">13px</div><div class="name">--text-sm</div><div style="font-size:13px;line-height:1;">Aa</div></div>
  <div class="row"><div class="size">11px</div><div class="name">--text-xs</div><div style="font-size:11px;line-height:1;letter-spacing:0.1em;text-transform:uppercase;">AA</div></div>
</body></html>
