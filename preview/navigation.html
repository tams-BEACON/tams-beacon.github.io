<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-primary); font-family: var(--font-serif); }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 60px;
    border-bottom: 1px solid var(--border-default);
  }
  .nav-logo { font-size: 18px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; }
  .nav-links { display: flex; gap: 28px; align-items: center; }
  .nav-link { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); cursor: pointer; transition: color 150ms; }
  .nav-link:hover, .nav-link.active { color: var(--fg-primary); }
  .nav-cta {
    font-family: var(--font-serif);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--color-black); color: var(--color-white);
    border: none; padding: 8px 18px; border-radius: 2px; cursor: pointer;
    transition: background 150ms;
  }
  .nav-cta:hover { background: var(--color-orange); }

  .nav-dark {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 60px;
    background: var(--color-black);
    margin-top: 16px;
  }
  .nav-dark .nav-logo { color: var(--color-white); }
  .nav-dark .nav-link { color: rgba(255,255,255,0.45); }
  .nav-dark .nav-link:hover { color: var(--color-white); }
  .nav-dark .nav-cta { background: var(--color-orange); color: var(--color-white); }
  .nav-dark .nav-cta:hover { background: var(--color-orange-dark); }
</style>
</head><body>
  <!-- Light nav -->
  <nav class="nav">
    <div class="nav-logo">B.E.A.C.O.N.</div>
    <div class="nav-links">
      <span class="nav-link active">About</span>
      <span class="nav-link">Events</span>
      <span class="nav-link">Team</span>
      <span class="nav-link">Contact</span>
    </div>
    <button class="nav-cta">Apply Now</button>
  </nav>

  <!-- Dark nav -->
  <nav class="nav-dark">
    <div class="nav-logo">B.E.A.C.O.N.</div>
    <div class="nav-links">
      <span class="nav-link active" style="color:rgba(255,255,255,0.9)">About</span>
      <span class="nav-link">Events</span>
      <span class="nav-link">Team</span>
      <span class="nav-link">Contact</span>
    </div>
    <button class="nav-cta">Apply Now</button>
  </nav>
</body></html>
