<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-primary); font-family: var(--font-serif); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 80px; }
  .swatch-block { height: 80px; }
  .swatch-label { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); margin-top: 6px; }
  .swatch-hex { font-size: 11px; color: var(--fg-secondary); font-family: var(--font-mono); }
  .swatch-desc { font-size: 10px; color: var(--fg-subtle); margin-top: 2px; }
  .section-title { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 12px; }
</style>
</head><body>
<div class="section-title">Accent — Brand Orange</div>
<div class="row">
  <div class="swatch">
    <div class="swatch-block" style="background:#F5B042;"></div>
    <div class="swatch-label">Orange Light</div>
    <div class="swatch-hex">#F5B042</div>
    <div class="swatch-desc">Highlight / glow</div>
  </div>
  <div class="swatch">
    <div class="swatch-block" style="background:#E8891A;"></div>
    <div class="swatch-label">Orange</div>
    <div class="swatch-hex">#E8891A</div>
    <div class="swatch-desc">Primary accent</div>
  </div>
  <div class="swatch">
    <div class="swatch-block" style="background:#C4701A;"></div>
    <div class="swatch-label">Orange Dark</div>
    <div class="swatch-hex">#C4701A</div>
    <div class="swatch-desc">Hover / active</div>
  </div>
  <div class="swatch">
    <div class="swatch-block" style="background:#D4A642;"></div>
    <div class="swatch-label">Amber</div>
    <div class="swatch-hex">#D4A642</div>
    <div class="swatch-desc">Secondary accent</div>
  </div>
  <div class="swatch">
    <div class="swatch-block" style="background:#EDE5D0; border: 1px solid #E4E4E4;"></div>
    <div class="swatch-label">Cream Dark</div>
    <div class="swatch-hex">#EDE5D0</div>
    <div class="swatch-desc">Dividers on cream</div>
  </div>
</div>
</body></html>
