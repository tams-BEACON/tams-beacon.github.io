<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome!</title>
  <link rel="stylesheet" href="beacon-kit.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="Animations.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="HomePage.jsx"></script>
  <script type="text/babel" src="EventsPage.jsx"></script>
  <script type="text/babel" src="TeamPage.jsx"></script>
  <script type="text/babel" src="ApplyPage.jsx"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #root { height: 100%; }
    .page-scroll {
      height: 100vh;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    /* Footer */
    .beacon-footer {
      background: #0A0A0A;
      padding: 48px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
    }
    .footer-logo {
      font-family: "Times New Roman", Georgia, serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .footer-tagline {
      font-family: "Times New Roman", Georgia, serif;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      line-height: 1.6;
      max-width: 220px;
    }
    .footer-links {
      display: flex;
      gap: 48px;
    }
    .footer-col-title {
      font-family: "Times New Roman", Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 14px;
    }
    .footer-col-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .footer-link {
      font-family: "Times New Roman", Georgia, serif;
      font-size: 14px;
      color: rgba(255,255,255,0.65);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      transition: color 150ms;
    }
    .footer-link:hover { color: #E8891A; }
    .footer-bottom {
      background: #0A0A0A;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 16px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-copy {
      font-family: "Times New Roman", Georgia, serif;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function Footer({ setPage }) {
      return (
        <>
          <footer className="beacon-footer">
            <div>
              <div className="footer-logo">
                <img src="../../assets/shiba_inu.png" style={{ height: '32px', imageRendering: 'pixelated' }} alt="" />
                B.E.A.C.O.N.
              </div>
              <div className="footer-tagline">Build Experiences And Career Opportunities Now.</div>
            </div>
            <div className="footer-links">
              <div>
                <div className="footer-col-title">Club</div>
                <div className="footer-col-links">
                  {['About', 'Events', 'Team'].map(l => (
                    <button key={l} className="footer-link" onClick={() => setPage(l)}>{l}</button>
                  ))}
                </div>
              </div>
              <div>
                <div className="footer-col-title">Join</div>
                <div className="footer-col-links">
                  <button className="footer-link" onClick={() => setPage('Apply')}>Apply Now</button>
                  <button className="footer-link">Contact Us</button>
                  <button className="footer-link">Instagram</button>
                </div>
              </div>
            </div>
          </footer>
          <div className="footer-bottom">
            <div className="footer-copy">© 2026 B.E.A.C.O.N. Student Club</div>
            <div className="footer-copy" style={{ color: '#E8891A', letterSpacing: '0.1em', textTransform: 'uppercase', fontSize: '10px' }}>Build Experiences And Career Opportunities Now</div>
          </div>
        </>
      );
    }

    function App() {
      const [page, setPage] = React.useState('Home');

      // Scroll to top on page change
      React.useEffect(() => {
        const el = document.getElementById('scroll-root');
        if (el) el.scrollTop = 0;
      }, [page]);

      const renderPage = () => {
        switch (page) {
          case 'Home':    return <HomePage setPage={setPage} />;
          case 'Events':  return <EventsPage />;
          case 'Team':    return <TeamPage setPage={setPage} />;
          case 'Apply':   return <ApplyPage />;
          default:        return <HomePage setPage={setPage} />;
        }
      };

      return (
        <div id="scroll-root" className="page-scroll">
          <Nav page={page} setPage={setPage} />
          <main>{renderPage()}</main>
          <Footer setPage={setPage} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
